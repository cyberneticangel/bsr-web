<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Big Scale Racing</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="canvas" tabindex="-1"></canvas>
<div id="flash"></div>

<div id="hud" class="hidden">
  <!-- one .hud-view per local player, filled from the template below (ids prefixed h- / h2-) -->
  <div class="hud-view" id="hud-p1" data-pre="h-"></div>
  <div class="hud-view" id="hud-p2" data-pre="h2-"></div>
</div>
<template id="hud-tpl">
  <div class="hud-tl">
    <div class="hbar" data-img="hud_position"><span class="hl">POS.</span><span class="hv"><b id="$place">1</b><small>/<span id="$racers">1</span></small></span></div>
    <div class="hbar" data-img="hud_lap"><span class="hl">LAP</span><span class="hv"><span id="$lap">1</span><small id="$lapsof">/<span id="$laps">3</span></small></span></div>
  </div>
  <div class="hud-tr">
    <div class="hbar" data-img="hud_timeremaining"><span class="hl" id="$timelabel">TIME</span><span class="hv" id="$time">0:00.00</span></div>
    <div class="hbar" data-img="hud_currentlap"><span class="hl">CURR. LAP</span><span class="hv" id="$laptime">0:00.00</span></div>
    <div class="hbar" data-img="hud_bestlap"><span class="hl">BEST LAP</span><span class="hv" id="$best">-:--.--</span></div>
  </div>
  <div class="hud-br">
    <div class="meter" data-img="hud_revsback"><div class="fill" data-img="hud_revs" id="$rev"></div></div>
    <div class="meter" data-img="hud_speedback"><div class="fill" data-img="hud_speed" id="$spd"></div></div>
    <div class="speed"><span id="$speed">0</span><small>KPH</small></div>
  </div>
  <div id="$countdown" class="countdown"></div>
  <div id="$msg" class="msg"></div>
  <div id="$keys" class="hud-keys"></div>
</template>

<div id="tags"></div>
<div id="board" class="panel hidden">
  <h2 id="board-title">STANDINGS</h2>
  <table id="board-table"></table>
  <p class="sub">Hold Tab</p>
</div>

<div id="touch" class="hidden">
  <div id="t-steer" class="t-pad"><div id="t-knob"></div></div>
  <div class="t-btns">
    <button id="t-brake">BRAKE</button>
    <button id="t-gas">GAS</button>
  </div>
</div>

<div id="menu" class="panel">
  <h1>BIG SCALE RACING</h1>
  <p class="sub">WebAssembly port · original BumbleBeast data</p>
  <div class="row"><label>Mode</label><div id="modes" class="choices">
    <button data-v="single">Quick race</button><button data-v="practice">Practice</button><button data-v="champ">Championship</button><button data-v="split">Split screen</button><button data-v="online">Online</button>
  </div></div>
  <div id="online" class="hidden">
    <div id="online-join">
      <div class="row"><label>Name</label><input id="net-name" type="text" maxlength="20" placeholder="Player" autocomplete="nickname"></div>
      <div class="row"><label>Room</label><input id="net-code" type="text" maxlength="4" placeholder="CODE" autocomplete="off">
        <button id="net-join">Join</button><button id="net-create">Create room</button></div>
    </div>
    <div id="online-room" class="hidden">
      <div class="row"><label>Room</label><b id="net-room" class="room-code"></b>
        <button id="net-invite">Copy invite link</button><button id="net-leave">Leave</button></div>
      <ul id="net-players"></ul>
    </div>
  </div>
  <div id="champ" class="hidden">
    <div id="champ-pick">
      <div class="row"><label>Cup</label><div id="champ-cups" class="choices cups"></div></div>
      <p id="champ-info" class="sub"></p>
    </div>
    <div id="champ-season" class="hidden">
      <h2 id="champ-title"></h2>
      <p id="champ-next" class="sub"></p>
      <table id="champ-table" class="table"></table>
      <div class="row champ-btns"><button id="champ-skip" title="You finish last and get one point">Skip race</button>
        <button id="champ-abandon">Abandon championship</button></div>
    </div>
  </div>
  <div class="row" id="row-track"><label>Track</label><div id="tracks" class="choices"></div></div>
  <div class="row" id="row-cls"><label>Class</label><select id="cls"></select></div>
  <div class="row" id="row-weather"><label>Weather</label><select id="weather"></select></div>
  <div class="row" id="row-skin"><label id="skin-label">Skin</label><div id="skins" class="choices skins"></div></div>
  <div class="row hidden" id="row-skin2"><label>P2 skin</label><div id="skins2" class="choices skins"></div></div>
  <div class="row" id="row-racetype"><label>Race type</label><div id="racetype" class="choices">
    <button data-v="cup" title="Only opponents of your class">Cup race</button><button data-v="open" title="Opponents from all classes">Open race</button>
  </div></div>
  <div class="row" id="row-opp"><label id="opp-label">Opponents</label><input id="opp" type="range" min="0" max="7" value="5"><span id="opp-v">5</span></div>
  <div class="row" id="row-length"><label>Length</label><div id="lenmode" class="choices">
    <button data-v="laps">Laps</button><button data-v="time">Time</button></div>
    <span id="len-laps" class="len"><input id="laps" type="range" min="1" max="10" value="3"><span id="laps-v">3</span></span>
    <select id="minutes" class="len"><option value="1">1 min</option><option value="2">2 min</option><option value="3" selected>3 min</option>
      <option value="5">5 min</option><option value="10">10 min</option><option value="20">20 min</option></select>
  </div>
  <div class="row hidden" id="row-ghost"><label>Ghost</label><div id="ghost" class="choices">
    <button data-v="0">Off</button><button data-v="1">Best lap</button><button data-v="2">Last lap</button></div></div>
  <div class="row"><label>Music</label><div id="musicmode" class="choices">
    <button data-v="stereo" title="Normal music">Stereo</button><button data-v="localized" title="Played by the loudspeakers around the track">Localized</button><button data-v="off">Off</button></div></div>
  <div class="row"><label>HUD size</label><input id="hudscale" type="range" min="60" max="160" step="10" value="100"><span id="hudscale-v">100%</span></div>
  <div class="row" id="row-genres"><label>Genres</label><div id="genres" class="choices">
    <button data-v="surf">50's surf</button><button data-v="rock">Rock</button><button data-v="dance">Dance</button></div></div>
  <button id="go" class="big">RACE</button>
  <div id="status"></div>
</div>

<div id="pause" class="panel hidden">
  <h2 id="pause-title">PAUSED</h2>
  <button id="resume" class="big">RESUME</button>
  <button id="restart">RESTART</button>
  <button id="quit">QUIT TO MENU</button>
</div>

<div id="podium" class="hidden">
  <ol id="podium-names"></ol>
  <button id="podium-go" class="big">CONTINUE</button>
</div>

<div id="results" class="panel hidden">
  <h2>RESULTS</h2>
  <table id="res-table"></table>
  <p id="res-note" class="sub"></p>
  <button id="again" class="big">RACE AGAIN</button>
  <button id="tomenu">MENU</button>
</div>

<script src="game.js"></script>
<script src="bsr.js"></script>
</body>
</html>
